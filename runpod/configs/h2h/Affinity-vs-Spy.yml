# Head-to-head: Affinity ($MODEL, port 50052, priors @PRIORS@) vs Spy ($OPP_MODEL, port 50053, priors @OPP_PRIORS@), 100 games.
# Output: /workspace/runs/h2h-@TAG@ (runpod/generate.sh, TAG, PRIORS, TARGET_PRIORS, OPP_PRIORS and OPP_MODEL from the environment).

goes_first: random  # player_a, player_b, random

player_a:
  deckPath: decks/Pauper-Affinity.txt
  type: mcts
  output_file: /workspace/runs/h2h-@TAG@/PlayerA/Pauper-Affinity_vs_Pauper-Spy.hdf5

  priors:
    priority: @PRIORS@
    target: @TARGET_PRIORS@
    binary: false
    opponent: false
    prior_temperature: 1.5

  noise:
    enabled: false
    dirichlet_noise: 0.15 #does nothing
    selection_temperature: 2 #does nothing

  mcts:
    search_budget: 300
    timeout_ms: 60000
    td_discount: 0.92
    offline_mode: false
    prune_duplicate_states: true
    max_pending: 4
    c_puct: 1.0
    pimc: false

  gameplay:
    mulligans_enabled: false
    manual_tapping: false


  hiddenInfo:
    see_opponent_hand: true

player_b:
  deckPath: decks/Pauper-Spy.txt
  type: mcts
  output_file: /workspace/runs/h2h-@TAG@/PlayerB/Pauper-Spy_vs_Pauper-Affinity.hdf5

  priors:
    priority: @OPP_PRIORS@
    target: false
    binary: false
    opponent: false
    prior_temperature: 1.5

  noise:
    enabled: false
    dirichlet_noise: 0.15 #does nothing
    selection_temperature: 2 #does nothing

  mcts:
    search_budget: 300
    timeout_ms: 60000
    td_discount: 0.92
    offline_mode: false
    prune_duplicate_states: true
    max_pending: 4
    c_puct: 1.0
    pimc: false

  gameplay:
    mulligans_enabled: false
    manual_tapping: false


  hiddenInfo:
    see_opponent_hand: true

training:
  games: 100
  threads: 64
  max_turns: 50 #does nothing
  max_minutes: 120

server:
  host: localhost
  port: 50052 #50052
  opponent_port: 50053

logging:
  sparse: false #does nothing
  all_threads: true
  log_feature_hash: false
  save_final_wr: true
  show_mcts_info: true #does nothing
