# gen2 data vs gen1: the gen2 model (ver10) for Faeries against the gen1 model (v4, $OPP_MODEL on port 50053), value only, 200 games.
# Output: /workspace/runs/gen2-vsgen1 (runpod/generate.sh).

goes_first: random  # player_a, player_b, random

player_a:
  deckPath: decks/Pauper-Faeries.txt
  type: mcts
  output_file: /workspace/runs/gen2-vsgen1/PlayerA/Pauper-Faeries_vs_Standard-MonoG_gen1.hdf5

  priors:
    priority: false
    target: false
    binary: false
    opponent: false
    prior_temperature: 1.5

  noise:
    enabled: false
    dirichlet_noise: 0.15 #does nothing
    selection_temperature: 2 #does nothing

  mcts:
    search_budget: 300
    timeout_ms: 60000
    td_discount: 0.92
    offline_mode: false
    prune_duplicate_states: true
    max_pending: 4
    c_puct: 1.0
    pimc: false

  gameplay:
    mulligans_enabled: false
    manual_tapping: false


  hiddenInfo:
    see_opponent_hand: true

player_b:
  deckPath: decks/Standard-MonoG.dck
  type: mcts
  output_file: /workspace/runs/gen2-vsgen1/PlayerB/Standard-MonoG_vs_Pauper-Faeries_gen1.hdf5

  priors:
    priority: false
    target: false
    binary: false
    opponent: false
    prior_temperature: 1.5

  noise:
    enabled: false
    dirichlet_noise: 0.15 #does nothing
    selection_temperature: 2 #does nothing

  mcts:
    search_budget: 300
    timeout_ms: 60000
    td_discount: 0.92
    offline_mode: false
    prune_duplicate_states: true
    max_pending: 4
    c_puct: 1.0
    pimc: false

  gameplay:
    mulligans_enabled: false
    manual_tapping: false


  hiddenInfo:
    see_opponent_hand: true

training:
  games: 200
  threads: 64
  max_turns: 50 #does nothing
  max_minutes: 120

server:
  host: localhost
  port: 50052 #50052
  opponent_port: 50053

logging:
  sparse: false #does nothing
  all_threads: true
  log_feature_hash: false
  save_final_wr: true
  show_mcts_info: true #does nothing
