# Normed test, 1000 sims for the model, piloting Burn (offline Burn stays at 300), duplicate-state pruning off on both sides: Burn ($MODEL, priority and target priors @PRIORS@) vs offline Burn, 100 games.
# Output: /workspace/runs/norm1000np-burnburn-@TAG@ (runpod/generate.sh, TAG and PRIORS from the environment).

goes_first: random  # player_a, player_b, random

player_a:
  deckPath: decks/Pauper-Burn.txt
  type: mcts
  output_file: /workspace/runs/norm1000np-burnburn-@TAG@/PlayerA/Pauper-Burn_vs_Pauper-Burn.hdf5

  priors:
    priority: @PRIORS@
    target: @PRIORS@
    binary: false
    opponent: false
    prior_temperature: 1.5

  noise:
    enabled: false
    dirichlet_noise: 0.15 #does nothing
    selection_temperature: 2 #does nothing

  mcts:
    search_budget: 1000
    timeout_ms: 60000
    td_discount: 0.92
    offline_mode: false
    prune_duplicate_states: false
    max_pending: 4
    c_puct: 1.0
    pimc: false

  gameplay:
    mulligans_enabled: false
    manual_tapping: false


  hiddenInfo:
    see_opponent_hand: true

player_b:
  deckPath: decks/Pauper-Burn.txt
  type: mcts
  output_file: /workspace/runs/norm1000np-burnburn-@TAG@/PlayerB/Pauper-Burn_vs_Pauper-Burn.hdf5

  priors:
    priority: false
    target: false
    binary: false
    opponent: false
    prior_temperature: 1.5

  noise:
    enabled: false
    dirichlet_noise: 0.15 #does nothing
    selection_temperature: 2 #does nothing

  mcts:
    search_budget: 300
    timeout_ms: 60000
    td_discount: 0.92
    offline_mode: true
    prune_duplicate_states: false
    max_pending: 4
    c_puct: 1.0
    pimc: false

  gameplay:
    mulligans_enabled: false
    manual_tapping: false


  hiddenInfo:
    see_opponent_hand: true

training:
  games: 100
  threads: 64
  max_turns: 50 #does nothing
  max_minutes: 120

server:
  host: localhost
  port: 50052 #50052
  opponent_port: 50052 #50053

logging:
  sparse: false #does nothing
  all_threads: true
  log_feature_hash: false
  save_final_wr: true
  show_mcts_info: true #does nothing
