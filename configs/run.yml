# run.yml — defines a single deck training run

deck: UWTempo
version: 19
start_from_version: 19     # null = offline bootstrap, set to resume from checkpoint

generations: 2
games_per_gen: 100
replay_buffer_gens: 10

opponents:
  - deck: Standard-MonoR
    mode: mcts
  - deck: Standard-MonoG
    mode: mcts
  - deck: Standard-MonoB
    mode: mcts
  - deck: Standard-MonoW
    mode: mcts
  - deck: Standard-MonoU
    mode: mcts
training:
  analyze_dataset: true
  generate_plots: true
  eval_previous_model: true

log_level: ACTIONS           # ALL | GAMEPLAY | ACTIONS | ERROR

curriculum: configs/curriculum.yml