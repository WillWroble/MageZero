# run.yml — defines a single deck training run

deck: Standard32-UWB
version: 1
start_from_version: null     # null = offline bootstrap, set to resume from checkpoint

generations: 1
games_per_gen: 4
replay_buffer_gens: 10

opponents:
  - deck: Standard-MonoB
    mode: mcts
    offline: true
  - deck: Standard-MonoG
    mode: mcts
    offline: true
  - deck: Standard-MonoR
    mode: mcts
    offline: true
  - deck: Standard-MonoU
    mode: mcts
    offline: true
  - deck: Standard-MonoW
    mode: mcts
    offline: true
  - deck: Standard16-GB
    mode: mcts
    offline: true
  - deck: Standard16-RB
    mode: mcts
    offline: true
  - deck: Standard16-UB
    mode: mcts
    offline: true
  - deck: Standard16-BW
    mode: mcts
    offline: true
  - deck: Standard16-RG
    mode: mcts
    offline: true
  - deck: Standard16-UG
    mode: mcts
    offline: true
  - deck: Standard16-GW
    mode: mcts
    offline: true
  - deck: Standard16-UR
    mode: mcts
    offline: true
  - deck: Standard16-RW
    mode: mcts
    offline: true
  - deck: Standard16-UW
    mode: mcts
    offline: true
  - deck: Standard16-5C
    mode: mcts
    offline: true
training:
  analyze_dataset: true
  generate_plots: true
  eval_previous_model: true
  dense_vocab: false          # true: embedding rows only for features in use (~MBs instead of ~4 GB)

log_level: ACTIONS           # ALL | GAMEPLAY | ACTIONS | ERROR

curriculum: configs/curriculum.yml
max_jvms: 2