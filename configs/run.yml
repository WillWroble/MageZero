# run.yml — defines a single deck training run

deck: UWTempo
version: 28
start_from_version: null     # null = offline bootstrap, set to resume from checkpoint

generations: 1
games_per_gen: 100
replay_buffer_gens: 10

opponents:
  - deck: Standard-MonoR
    mode: mcts
    offline: true
  - deck: Standard-MonoG
    mode: mcts
    offline: true
  - deck: Standard-MonoB
    mode: mcts
    offline: true
  - deck: Standard-MonoW
    mode: mcts
    offline: true
  - deck: Standard-MonoU
    mode: mcts
    offline: true
training:
  analyze_dataset: true
  generate_plots: true
  eval_previous_model: true

log_level: ACTIONS           # ALL | GAMEPLAY | ACTIONS | ERROR

curriculum: configs/curriculum.yml
max_jvms: 2